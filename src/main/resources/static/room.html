<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>varanda — sala</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #141414;
            --bg-card: #1e1e1e;
            --border: rgba(255,255,255,0.14);
            --border-strong: rgba(255,255,255,0.32);
            --text-primary: #f5f5f5;
            --text-secondary: #a8a8a8;
            --text-tertiary: #6e6e6e;
            --live: #7fe0b4;
            --radius-md: 8px;
            --radius-sm: 6px;
            --font-display: "Space Grotesk", sans-serif;
            --font-body: "Inter", sans-serif;
            --font-mono: "IBM Plex Mono", monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
        }

        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        :focus-visible { outline: 1px solid var(--text-primary); outline-offset: 2px; }

        input {
            font-family: inherit;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 10px 12px;
            font-size: 14px;
        }
        input::placeholder { color: var(--text-tertiary); }
        input:focus { border-color: var(--text-primary); outline: none; }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
        }

        .back-link {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-secondary);
        }
        .back-link:hover { color: var(--text-primary); }

        .room-title-wrap { display: flex; align-items: baseline; gap: 12px; }

        .room-title { font-family: var(--font-display); font-weight: 600; font-size: 18px; }

        .room-code {
            font-family: var(--font-mono);
            font-size: 12px;
            border: 1px solid var(--border-strong);
            padding: 3px 9px;
            border-radius: 999px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .room-code:hover { color: var(--text-primary); border-color: var(--text-primary); }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        .join-panel {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 18px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .join-panel input { flex: 1; }

        .btn-solid {
            background: var(--text-primary);
            color: var(--bg);
            font-weight: 600;
            font-size: 13px;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
        }
        .btn-solid:hover { opacity: 0.85; }

        .btn-outline {
            font-size: 12px;
            padding: 7px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-strong);
            color: var(--text-primary);
        }
        .btn-outline:hover { background: var(--bg-card); }

        .room-body { display: none; }
        .room-body.visible { display: block; }

        .presence-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }

        .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); }

        .chat-box {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            height: 380px;
            overflow-y: auto;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .msg { font-size: 13px; }
        .msg .sender { color: var(--text-secondary); font-weight: 600; margin-right: 6px; }
        .msg.system { color: var(--text-tertiary); font-style: italic; }

        .send-row { display: flex; gap: 8px; }
        .send-row input { flex: 1; }

        .status-text { color: var(--text-tertiary); font-size: 13px; padding: 20px 0; }
    </style>
</head>
<body>

<div class="topbar">
    <a class="back-link" href="dashboard.html">← voltar</a>
    <div class="room-title-wrap" id="roomHeader" style="display:none">
        <span class="room-title" id="roomTitle">carregando…</span>
        <span class="room-code" id="roomCode" title="clique para copiar">código: ----</span>
    </div>
    <div class="room-title-wrap" id="codeSearchWrap" style="display:none">
        <input id="roomCodeInput" placeholder="cole o código da sala" />
        <button class="btn-outline" id="btnBuscarCodigo">entrar com código</button>
    </div>
    <button class="btn-outline" id="btnSair" style="visibility:hidden">sair</button>
</div>

<div class="container">
    <div id="statusText" class="status-text"></div>

    <div class="join-panel" id="joinPanel" style="display:none">
        <input id="username" placeholder="seu nome" value="visitante" />
        <button class="btn-solid" id="btnEntrar">entrar na sala</button>
    </div>

    <div class="room-body" id="roomBody">
        <div class="presence-bar">
            <span class="live-dot"></span>
            <span id="presenceText">0 pessoa na sala</span>
        </div>

        <div class="chat-box" id="chatBox"></div>

        <div class="send-row">
            <input id="msgInput" placeholder="escreva uma mensagem…" />
            <button class="btn-solid" id="btnEnviar">enviar</button>
        </div>
    </div>
</div>

<script>
    const API = "";
    const params = new URLSearchParams(window.location.search);
    let roomCode = params.get("code");

    let stompClient = null;
    let currentUser = null;

    const statusText = document.getElementById("statusText");
    const joinPanel = document.getElementById("joinPanel");
    const roomBody = document.getElementById("roomBody");
    const btnSair = document.getElementById("btnSair");
    const roomHeader = document.getElementById("roomHeader");
    const codeSearchWrap = document.getElementById("codeSearchWrap");

    function addMessage(sender, content, isSystem) {
        const box = document.getElementById("chatBox");
        const div = document.createElement("div");
        div.className = "msg" + (isSystem ? " system" : "");
        div.innerHTML = isSystem
            ? content
            : `<span class="sender">${sender}:</span>${content}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function showCodeSearch(message) {
        roomHeader.style.display = "none";
        codeSearchWrap.style.display = "flex";
        joinPanel.style.display = "none";
        statusText.textContent = message || "";
    }

    async function loadRoomInfo(code) {
        try {
            const res = await fetch(`${API}/api/rooms/${code}`);
            if (!res.ok) {
                showCodeSearch("Sala não encontrada. Confira o código e tente de novo.");
                return;
            }
            const room = await res.json();
            roomCode = room.code;
            document.getElementById("roomTitle").textContent = room.title || "sala sem nome";
            document.getElementById("roomCode").textContent = `código: ${room.code}`;
            roomHeader.style.display = "flex";
            codeSearchWrap.style.display = "none";
            joinPanel.style.display = "flex";
            statusText.textContent = "";
            history.replaceState(null, "", `room.html?code=${room.code}`);
        } catch (e) {
            showCodeSearch("Não consegui falar com o servidor.");
        }
    }

    document.getElementById("roomCode").onclick = () => {
        navigator.clipboard.writeText(roomCode).then(() => {
            statusText.textContent = "Código copiado!";
            setTimeout(() => (statusText.textContent = ""), 1500);
        });
    };

    document.getElementById("btnBuscarCodigo").onclick = () => {
        const code = document.getElementById("roomCodeInput").value.trim().toUpperCase();
        if (!code) return;
        loadRoomInfo(code);
    };

    document.getElementById("roomCodeInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("btnBuscarCodigo").click();
    });

    document.getElementById("btnEntrar").onclick = () => {
        const username = document.getElementById("username").value.trim() || "visitante";
        entrarNaSala(username);
    };

    function entrarNaSala(username) {
        currentUser = username;

        const socket = new SockJS(`${API}/ws`);
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, () => {
            joinPanel.style.display = "none";
            roomBody.classList.add("visible");
            btnSair.style.visibility = "visible";
            addMessage(null, `Você entrou na sala como "${username}".`, true);

            stompClient.subscribe(`/topic/sala/${roomCode}`, (frame) => {
                const body = JSON.parse(frame.body);
                addMessage(body.sender, body.content);
            }, { username });

            stompClient.subscribe(`/topic/sala/${roomCode}/presenca`, (frame) => {
                const usuarios = JSON.parse(frame.body);
                atualizarPresenca(usuarios);
            }, { username });

            buscarPresencaInicial(roomCode);
        }, (err) => {
            statusText.textContent = "Erro ao conectar: " + err;
        });
    }

    function atualizarPresenca(usuarios) {
        const n = usuarios.length;
        document.getElementById("presenceText").textContent =
            `${n} ${n === 1 ? "pessoa" : "pessoas"} na sala`;
    }

    async function buscarPresencaInicial(code) {
        const res = await fetch(`${API}/api/rooms/${code}/presence`);
        const usuarios = await res.json();
        atualizarPresenca(usuarios);
    }

    document.getElementById("btnEnviar").onclick = enviarMensagem;
    document.getElementById("msgInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") enviarMensagem();
    });

    function enviarMensagem() {
        const input = document.getElementById("msgInput");
        const content = input.value.trim();
        if (!content || !stompClient || !roomCode) return;

        stompClient.send(`/app/sala/${roomCode}/enviar`, {}, JSON.stringify({
            sender: currentUser,
            content: content
        }));
        input.value = "";
    }

    btnSair.onclick = () => {
        if (!stompClient) return;

        stompClient.disconnect(() => {
            addMessage(null, "Você saiu da sala.", true);
            stompClient = null;
            currentUser = null;
            roomBody.classList.remove("visible");
            btnSair.style.visibility = "hidden";
            joinPanel.style.display = "flex";
        });
    };

    if (roomCode) {
        loadRoomInfo(roomCode);
    } else {
        showCodeSearch();
    }
</script>
</body>
</html>
